<div class="login-page">
  <div class="login-page__cabinet"><img alt="" data-ref="cabinet" /></div>

  <span class="login-page__divider"></span>
  <span class="login-page__rule login-page__rule--v"></span>
  <span class="login-page__rule login-page__rule--h"></span>
  <span class="login-page__corner login-page__corner--tl"></span>
  <span class="login-page__corner login-page__corner--tr"></span>
  <span class="login-page__corner login-page__corner--bl"></span>
  <span class="login-page__corner login-page__corner--br"></span>

  <div class="login-page__content" data-ref="content">
    <span class="login-page__bracket"></span>
    <h1 class="login-page__mark" data-ref="mark"></h1>

    <!-- One line: there is no space around this break, so wrapping the
         source here would introduce one. -->
    <p class="login-page__tagline">Secure. Simple. Passwordless.<br />Access your account with a passkey.</p>

    <!-- The message line is a child of the actions box so it can be placed
         from the buttons' own edges, and absolute so it cannot move them. -->
    <div class="login-page__actions" data-ref="actions"></div>
  </div>

  <!-- A sibling of the content, not a child: it is placed from the page's
       edges, and the page is the box the content's own percentage padding
       is measured against. Positioned inside the content instead, its
       insets would resolve against the content's narrower box and the link
       would sit off the buttons' centre. -->
  <div class="login-page__footer" data-ref="footer"></div>
</div>
