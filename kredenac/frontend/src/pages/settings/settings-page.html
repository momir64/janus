<!-- Same shell as the home page, so the page itself never scrolls. -->
<div class="app-shell">
  <!-- The frame holds the heading and the rule still; what scrolls is
       inside it. The nav sits outside the centred column so its buttons
       keep the page's own 36px corners. -->
  <div class="settings-scroll" data-ref="frame">
    <div class="settings-page">
      <!-- Desktop 145:14 vs mobile 157:20 word this differently. -->
      <h2 class="settings-page__heading">
        <span class="u-desktop-only">Passkeys associated with this account</span>
        <span class="u-mobile-only">Associated passkeys</span>
      </h2>

      <div class="settings-page__rule"></div>

      <div class="settings-page__layout" data-ref="layout">
        <div class="settings-page__passkeys" data-ref="list"></div>
        <div class="settings-page__danger" data-ref="danger"></div>
      </div>
    </div>
  </div>
</div>
