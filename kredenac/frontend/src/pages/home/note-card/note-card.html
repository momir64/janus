<div class="note-card">
  <!-- Top-right, on its own offset rather than the title's (2035:160
       mobile, 2032:34 desktop). -->
  <span class="note-card__date" data-ref="date"></span>
  <!-- A note needs only one of the two, so the empty half is left out
       entirely rather than rendered as a blank line. -->
  <h3 class="note-card__title" data-ref="title"></h3>
  <p class="note-card__body" data-ref="body"></p>
  <div class="note-card__actions">
    <button class="icon-btn" aria-label="Edit" data-ref="edit"></button>
    <button class="icon-btn" aria-label="Delete" data-ref="delete"></button>
  </div>
</div>
