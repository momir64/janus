<!-- The shell owns the viewport height so the lists can scroll inside
     themselves rather than the whole page moving under the nav. -->
<div class="app-shell">
  <div data-ref="nav"></div>
  <div class="home-page">
    <div class="home-page__columns">
      <div class="home-page__column" data-tab="files" data-ref="files-column">
        <div class="home-page__list" data-ref="files-list"></div>
      </div>
      <!-- Same split as the upload control: desktop gets the icon-trailing
           "Add a new note" button, mobile the compact corner-bracketed one. -->
      <div class="home-page__column" data-tab="notes" data-ref="notes-column">
        <div class="home-page__list home-page__list--notes" data-ref="notes-list"></div>
      </div>
    </div>
  </div>
</div>
