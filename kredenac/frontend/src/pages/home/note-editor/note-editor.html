<div class="note-editor">
  <!-- Neither field has a visible label in the design, and a placeholder is
       not one: it goes as soon as there is anything to read it against. The
       names are given to assistive technology instead. -->
  <div class="field">
    <input type="text" placeholder="Some title..." aria-label="Note title" data-ref="title" />
  </div>
  <div class="field field--body note-editor__body">
    <textarea placeholder="Lorem ipsum dolor sit amet..." aria-label="Note text" data-ref="body"></textarea>
  </div>
  <div class="note-editor__actions" data-ref="actions"></div>
</div>
