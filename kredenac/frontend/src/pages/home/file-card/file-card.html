<div class="file-card">
  <span class="file-card__name" data-ref="name"></span>
  <span class="file-card__size">Size: <b data-ref="size"></b></span>
  <span class="file-card__date" data-ref="date"></span>
  <div class="file-card__actions">
    <button class="icon-btn" aria-label="Delete" data-ref="delete"></button>
    <button class="icon-btn" aria-label="Download" data-ref="download"></button>
  </div>
</div>
