services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: -p ${POSTGRES_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ./certs/redis.crt:/tls/redis.crt:ro
      - ./certs/redis.key:/tls/redis.key:ro
      - ./certs/ca.crt:/tls/ca.crt:ro
    command: >
      redis-server
      --port 0
      --tls-port ${REDIS_PORT}
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients no
      --requirepass ${REDIS_PASSWORD}

  minio:
    container_name: minio
    image: minio/minio
    restart: unless-stopped
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  backend:
    container_name: backend
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_HOST: minio
      BACKEND_TLS_KEYSTORE_PATH: /certs/backend.p12
      REDIS_TLS_TRUSTSTORE_PATH: /certs/redis-truststore.jks
      FRONTEND_DIST_PATH: /app/static
    volumes:
      - ./certs/backend.p12:/certs/backend.p12:ro
      - ./certs/redis-truststore.jks:/certs/redis-truststore.jks:ro
    depends_on:
      - postgres
      - redis
      - minio

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
